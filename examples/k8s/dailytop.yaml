---
# Reference deployment for `dailytop:k8s`, the NVIDIA-accelerated variant. An EXAMPLE:
# set the image, storage class and node selector to match your cluster.
#
# Background: docs/image-design.md#k8s and docs/troubleshooting.md
#
# Verify once it is up:
#   kubectl exec deploy/dailytop -- nvidia-smi
#   kubectl exec deploy/dailytop -- vainfo
#   kubectl logs deploy/dailytop | grep -E 'Driver:|NVENC|Mode:'
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dailytop-config
  labels:
    app.kubernetes.io/name: dailytop
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: your-storage-class
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dailytop
  labels:
    app.kubernetes.io/name: dailytop
spec:
  replicas: 1
  strategy:
    # Required: the /config PVC is RWO, so a RollingUpdate deadlocks with
    # `Multi-Attach error` when the new pod lands on another node.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dailytop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dailytop
    spec:
      # Injects the NVIDIA userspace driver. Without this, nothing else here helps.
      runtimeClassName: nvidia

      # GPU *rendering* needs a newer node driver than NVENC alone. Pin rather than
      # letting the scheduler pick. Adjust the label to your cluster's.
      # nodeSelector:
      #   nvidia.com/gpu.present: "true"

      securityContext:
        seccompProfile:
          # flatpak's bwrap sandbox needs this.
          type: Unconfined

      containers:
        - name: dailytop
          image: registry.example.com/dailytop:k8s
          # With a mutable tag a node that already cached the image keeps serving the
          # OLD build under a pod that reports healthy. Prefer an immutable tag.
          imagePullPolicy: IfNotPresent

          securityContext:
            # Unmasks /proc for flatpak's bwrap -- far narrower than privileged, and it
            # avoids leaking the host's /dev/dri. Needs the ProcMountType feature gate;
            # without it fall back to `privileged: true`.
            # docs/troubleshooting.md#what-privileged-actually-buys-unmasked-proc
            procMount: Unmasked

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
            - name: TITLE
              value: "dailytop"
            - name: KEYBOARD
              value: "en-us-qwerty"
            - name: SUBFOLDER
              value: "/"
            - name: PIXELFLUX_WAYLAND
              value: "true"

            # REQUIRED -- empty or unset means the runtime injects nothing at all.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            # Needs at least compute,video (NVENC/CUDA) and graphics (EGL).
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"

            - name: DRINODE
              value: "/dev/dri/renderD128"
            # pixelflux picks its encoder backend from DRI_NODE's driver; zero-copy
            # when it equals DRINODE.
            - name: DRI_NODE
              value: "/dev/dri/renderD128"

            # `x264enc` is the hardware full-frame path; the rest are CPU fallbacks.
            - name: SELKIES_ENCODER
              value: "x264enc,x264enc-striped,jpeg"

            # Firefox's native-Wayland path freezes against this kwin; the image's
            # VAAPI prefs assume XWayland.
            - name: MOZ_ENABLE_WAYLAND
              value: "0"

            # The lock screen needs a password to open. Supply one or disable the lock.
            - name: LOCK_ON_STARTUP
              value: "false"
            # - name: USER_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: dailytop
            #       key: user-password

          ports:
            - name: http
              containerPort: 3000
            - name: https
              containerPort: 3001

          volumeMounts:
            - name: config
              mountPath: /config
            # Chromium/Electron apps crash on the 64 MB default.
            - name: dshm
              mountPath: /dev/shm
            # Driver-version-locked EGL-on-X11 platform libraries, not injected by the
            # GPU operator. The image bakes the glvnd configs that reference them.
            - name: nvidia-egl-xcb
              mountPath: /usr/lib64/libnvidia-egl-xcb.so.1
              readOnly: true
            - name: nvidia-egl-xlib
              mountPath: /usr/lib64/libnvidia-egl-xlib.so.1
              readOnly: true
            # Extra root CAs, installed at start by 00-ca-certs.sh. Uncomment together
            # with the `ca-certs` volume below. See certs/README.md.
            # - name: ca-certs
            #   mountPath: /certs
            #   readOnly: true

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: dailytop-config
        # Create with:
        #   kubectl create secret generic dailytop-ca --from-file=my-ca.crt
        # Every key ending .crt / .pem in the secret is trusted.
        # - name: ca-certs
        #   secret:
        #     secretName: dailytop-ca
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: nvidia-egl-xcb
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libnvidia-egl-xcb.so.1
            type: File
        - name: nvidia-egl-xlib
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/libnvidia-egl-xlib.so.1
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: dailytop
  labels:
    app.kubernetes.io/name: dailytop
spec:
  selector:
    app.kubernetes.io/name: dailytop
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: https
      port: 3001
      targetPort: https
