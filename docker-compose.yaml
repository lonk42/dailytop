---
# The `full` dailytop variant on a single Docker host.
#
#   cp .env.example .env && $EDITOR .env
#   ./build.sh full
#   docker compose up -d          # then open https://localhost:3001/
#
# Software rendered by default. For NVIDIA, uncomment the two NVIDIA blocks below and
# set SELKIES_ENCODER=x264enc,x264enc-striped,jpeg in .env.
services:
  dailytop:
    image: ${IMAGE:-dailytop:full}
    container_name: dailytop

    # NVIDIA 1/2 -- needs nvidia-container-toolkit registered as a Docker runtime.
    # Exposing device nodes is NOT enough; only the runtime injects the userspace
    # driver. docs/troubleshooting.md#nvidia-exposing-devices-is-not-injecting-the-driver
    # runtime: nvidia

    # REQUIRED. Chromium/Electron apps crash on Docker's 64 MB default.
    shm_size: "2gb"

    # Unmasks /proc for flatpak's bwrap sandbox.
    # docs/troubleshooting.md#what-privileged-actually-buys-unmasked-proc
    security_opt:
      - seccomp:unconfined
      - systempaths=unconfined

    # Required by DinD: upstream's svc-docker starts dockerd only when
    # /dev/cpu_dma_latency exists, and parks on `sleep infinity` when it does not.
    # Set INSTALL_DIND=false at build time to drop both.
    # docs/image-design.md#docker-in-docker-and-explicit-runc
    privileged: true

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - TITLE=${TITLE:-dailytop}
      - KEYBOARD=${KEYBOARD:-en-us-qwerty}
      - SUBFOLDER=/
      # Native Wayland capture. docs/troubleshooting.md#the-encoder-model-read-this-first
      - PIXELFLUX_WAYLAND=true
      # Ordered fallback list. `x264enc` is the HARDWARE path -- CPU-only default here.
      - SELKIES_ENCODER=${SELKIES_ENCODER:-x264enc-striped,jpeg}
      - USER_PASSWORD=${USER_PASSWORD:?set USER_PASSWORD in .env (see .env.example)}
      # - LOCK_ON_STARTUP=false
      # Registry host[:port] using a private CA. See certs/README.md.
      # - PRIVATE_REGISTRY=registry.example.com

      # NVIDIA 2/2 -- uncomment together with `runtime: nvidia` above.
      # NVIDIA_VISIBLE_DEVICES must be non-empty or nothing is injected.
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - DRINODE=/dev/dri/renderD128
      # pixelflux picks its encoder backend from DRI_NODE's driver; zero-copy when it
      # equals DRINODE.
      # - DRI_NODE=/dev/dri/renderD128
      # Firefox hardware video decode. MOZ_DISABLE_RDD_SANDBOX weakens the sandbox around
      # the media decoder; without it the RDD process cannot open /dev/dri at all.
      # docs/image-design.md#firefox-egl-on-x11-then-vaapi
      # - LIBVA_DRIVER_NAME=nvidia
      # - NVD_BACKEND=direct
      # - MOZ_DISABLE_RDD_SANDBOX=1
      # Forces YouTube to VP9. Leave false on Ampere+, which decodes AV1 in hardware.
      # - FIREFOX_DISABLE_AV1=false

    volumes:
      - dailytop-config:/config
      # Extra root CAs; an empty mount is fine. See certs/README.md.
      - ./certs:/certs:ro
      # NVIDIA 3/3 -- the EGL-on-X11 platform libraries, which the container toolkit does
      # not inject and which are driver-locked, so they cannot be baked in. Without them
      # Firefox uses GLX, VAAPI is unavailable, and video decode stays on the CPU.
      # Mount the soname, never the versioned file: the version moves with the driver, and
      # docker silently creates a directory in place of a missing bind source.
      # Set NVIDIA_EGL_LIB_DIR in .env for a distro that is not /usr/lib.
      # - ${NVIDIA_EGL_LIB_DIR:-/usr/lib}/libnvidia-egl-xcb.so.1:/usr/lib64/libnvidia-egl-xcb.so.1:ro
      # - ${NVIDIA_EGL_LIB_DIR:-/usr/lib}/libnvidia-egl-xlib.so.1:/usr/lib64/libnvidia-egl-xlib.so.1:ro
      # Uncomment to build images inside the desktop. On an overlayfs-backed host the
      # inner dockerd falls back to fuse-overlayfs and BuildKit to its copying native
      # snapshotter; the source must be on a real filesystem, so set DOCKER_DATA_ROOT if
      # this checkout is not on one.
      # docs/troubleshooting.md#builds-inside-the-desktop-copy-every-layer
      # - ${DOCKER_DATA_ROOT:-./docker}:/var/lib/docker

    ports:
      - "3000:3000"   # HTTP  (the client refuses to start on a non-secure context)
      - "3001:3001"   # HTTPS -- use this one
      - "2222:2222"   # sshd (key auth only; put your key in /config/.ssh/authorized_keys)

    restart: unless-stopped

volumes:
  dailytop-config:
