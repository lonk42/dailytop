# Default values for dailytop. Reference: charts/dailytop/README.md
#
# The defaults deploy a software-rendered desktop that schedules anywhere. GPU
# acceleration, the unprivileged variant and flatpak support are opt-in below.

image:
  repository: ghcr.io/lonk42/dailytop
  # Image variant, prefixed to the chart's appVersion to form the tag: `k8s` gives
  # `k8s-ls290-1.0.0`. Set `tag` to override the whole thing.
  variant: k8s
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# One desktop per release. The /config PVC is ReadWriteOnce, so a second replica
# cannot schedule; the Deployment strategy is Recreate for the same reason.
replicaCount: 1

# Environment for the desktop container. Keys set here win over every default the
# chart adds for `gpu`, `unprivileged` and `flatpak` below.
env:
  TZ: UTC
  TITLE: dailytop
  KEYBOARD: en-us-qwerty
  SUBFOLDER: /
  # Native Wayland capture. docs/troubleshooting.md#the-encoder-model-read-this-first
  PIXELFLUX_WAYLAND: "true"
  # Firefox's native-Wayland path freezes against this compositor, and the image's
  # VAAPI prefs assume XWayland.
  MOZ_ENABLE_WAYLAND: "0"
  # Ordered encoder fallback list, set by the chart: `x264enc-striped,jpeg` (both CPU
  # encoders), or `x264enc,x264enc-striped,jpeg` when `gpu.enabled` puts the hardware
  # path first. Uncomment to pin it yourself.
  # SELKIES_ENCODER: x264enc-striped,jpeg
  # The KDE lock screen needs a password to open it, so the chart refuses to render this
  # as "true" without `auth.existingSecret`. docs/image-design.md#the-kde-lock-screen
  LOCK_ON_STARTUP: "false"

# Raw env entries, appended after `env`. Use for valueFrom.
extraEnv: []
# - name: SOME_KEY
#   valueFrom:
#     secretKeyRef: { name: my-secret, key: some-key }

envFrom: []

# Password for the in-desktop `abc` and `root` accounts. Only the `full` image applies
# it, through its 01-set-passwords.sh hook; every other variant sets the variable and
# ignores it. `k8s` carries the KDE lock screen without that hook, so unlocking a `k8s`
# desktop needs an equivalent script of your own under `initScripts`.
auth:
  # Secret holding the password. The chart creates no Secret of its own -- make it with
  #   kubectl create secret generic dailytop-credentials --from-literal=USER_PASSWORD=...
  existingSecret: ""
  secretKey: USER_PASSWORD

# Extra root CAs, installed before any service starts by the image's 00-ca-certs.sh.
# Every key ending .crt / .pem in the Secret is trusted. See certs/README.md.
caCerts:
  enabled: false
  existingSecret: ""
  mountPath: /certs

# Scripts dropped into /custom-cont-init.d and run before any service starts.
#
# Mounted one file at a time with subPath, never as a directory: a directory mount
# replaces /custom-cont-init.d outright and hides every hook baked into the image.
# docs/image-design.md#the-init-hooks
initScripts: {}
# 50-example.sh: |
#   #!/bin/bash
#   echo "[custom-init] hello"

gpu:
  # NVIDIA acceleration. Requires the container runtime to inject the userspace driver
  # -- exposing device nodes is not enough.
  # docs/troubleshooting.md#nvidia-exposing-devices-is-not-injecting-the-driver
  enabled: false
  runtimeClassName: nvidia
  # Requested and limited alike; a GPU cannot be overcommitted.
  resourceName: nvidia.com/gpu
  count: 1
  # Adds NVIDIA_VISIBLE_DEVICES, NVIDIA_DRIVER_CAPABILITIES, DRINODE, DRI_NODE, the
  # hardware encoder list and MOZ_ENABLE_WAYLAND=0. Any of them can be overridden in
  # `env` above.
  driverCapabilities: all
  driNode: /dev/dri/renderD128

  # NVIDIA's EGL-on-X11 platform libraries. They are driver-version-locked and the GPU
  # operator does not inject them; the image bakes the glvnd configs that name them, so
  # without these mounts Firefox falls back to software WebRender and loses hardware
  # video decode. docs/image-design.md#firefox-egl-on-x11-then-vaapi
  eglPlatformLibs:
    enabled: true
    # Node path holding libnvidia-egl-xcb.so.1 and libnvidia-egl-xlib.so.1. This is the
    # Debian/Ubuntu layout; on a Fedora/RHEL node it is /usr/lib64.
    hostPath: /usr/lib/x86_64-linux-gnu
    # Where they land in the container, which is Fedora.
    containerPath: /usr/lib64

# For an image built with `--build-arg UNPRIVILEGED=true`. Runs the session as a
# non-root uid with no capabilities under `restricted` PodSecurity. The /run emptyDir
# this switches on is not optional -- without it s6-overlay's preinit exits before any
# service starts. docs/unprivileged.md
unprivileged:
  enabled: false
  # Any uid that does not collide with an entry in the image's /etc/passwd. Leave null
  # to let the platform assign one (OpenShift does).
  runAsUser: 9999
  # Name for that uid's /etc/passwd entry; empty keeps the image default, `abc-unpriv`.
  # Must match [a-z_][a-z0-9_-]* and not already exist in the image's /etc/passwd.
  # docs/unprivileged.md#naming-the-runtime-user
  username: ""

# flatpak's bwrap sandbox needs an unmasked /proc, which needs an unconfined seccomp
# profile and the ProcMountType feature gate. Only the `desktop`, `full` and `k8s`
# images ship flatpaks; where the gate is off, set `privileged: true` under
# `containerSecurityContext` instead.
# docs/troubleshooting.md#what-privileged-actually-buys-unmasked-proc
flatpak:
  enabled: false

# Merged over whatever `unprivileged` and `flatpak` select, and win where they overlap.
podSecurityContext: {}
containerSecurityContext: {}

service:
  type: ClusterIP
  annotations: {}
  ports:
    # The selkies client refuses to start on plain HTTP unless the browser already
    # considers the origin secure -- which it does behind a TLS-terminating Ingress.
    http: 3000
    https: 3001

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  # Service port to route to. `http` is right behind a TLS-terminating Ingress; `https`
  # additionally needs your controller configured to talk TLS to the backend.
  port: http
  tls:
    enabled: false
    # Existing certificate Secret. Leave empty to let cert-manager create one from the
    # issuer named in `ingress.annotations`.
    secretName: ""

persistence:
  config:
    # The KDE profile, application data and caches. Disabled gives an emptyDir, and the
    # desktop resets on every restart.
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 50Gi
    # Keeps the PVC when the release is uninstalled.
    retain: false
  # Chromium and Electron applications crash on the 64 MiB default /dev/shm.
  shm:
    enabled: true
    sizeLimit: 2Gi

extraVolumes: []
extraVolumeMounts: []

resources:
  requests:
    cpu: 500m
    memory: 4Gi
  limits:
    memory: 16Gi
    # No CPU limit by default. Software H.264 encode of a desktop stream is bursty and
    # CPU-bound; a limit throttles the stream rather than the workload.

probes:
  # What the probes treat as "up".
  #
  #   session  execs sessionCommand. nginx answers on the http port whether or not the
  #            desktop behind it is alive, so a port check reports a healthy pod through
  #            a session that is crash-looping and serving nothing.
  #   tcp      connects to the http port. Cheaper, and all a non-selkies image can do.
  #
  # Overridable per probe with `method:` under any of the three below.
  method: session

  # Both processes are required for a usable stream: selkies serves it, kwin produces
  # the frames. Matched on process NAME -- `pgrep -f` matches the probe's own shell in
  # its own command line and would succeed no matter what is running.
  #
  # Both being alive is not sufficient. selkies binds its screen capture to the desktop
  # session once, so a desktop that restarted on its own reconnects but is never
  # captured: the stream is dead while both processes report up. The last check catches
  # that pairing by age -- selkies is started first and never by much, so a selkies far
  # older than the desktop means they are no longer the pair that was bound together.
  # Skipped where s6-svstat cannot answer, leaving the process checks alone.
  sessionCommand:
    - /bin/sh
    - -c
    - |
      pgrep -x selkies >/dev/null || exit 1
      pgrep -x kwin_wayland >/dev/null || exit 1
      s=$(s6-svstat -o updownfor /run/service/svc-selkies 2>/dev/null) || exit 0
      d=$(s6-svstat -o updownfor /run/service/svc-de 2>/dev/null) || exit 0
      case "$s:$d" in *[!0-9:]*|*::*|:*|*:) exit 0 ;; esac
      [ "$s" -le "$((d + 60))" ]

  startup:
    enabled: true
    # 5 minutes. A cold /config is slow the first time; the image builds a KDE profile.
    periodSeconds: 5
    failureThreshold: 60
    timeoutSeconds: 5
  readiness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
  liveness:
    # Restarting a desktop pod destroys the running session, so this is deliberately
    # slack: three and a half minutes of a dead session before it acts. s6 restarts a
    # dead service on its own, and this only fires when that has stopped working.
    enabled: true
    periodSeconds: 30
    failureThreshold: 7
    timeoutSeconds: 5

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
